# Runs when main branch is updated.
# Creates docker image & publishes to docker packages
# Uses ansible to trigger a redeployment of the latest code
name: Main Branch Build and Deploy
on:
  push:
    branches:
      - main

# Concurrency is per job, not per workflow: a newer push may cancel an older
# build, but never a deploy or smoke test already talking to prod; those queue.
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: extractions/setup-just@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Authenticated Docker Hub pulls avoid the anonymous rate limit that
      # intermittently fails base-image fetches during 'docker build'.
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run PR tests
        run: just check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push docker containers
        run: just docker-push sha-${{ github.sha }}

  deploy:
    needs: build
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: triplea-game/infrastructure/.github/workflows/shared-deploy.yml@v1
    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      LINODE_READ_ONLY_TOKEN: ${{ secrets.LINODE_READ_ONLY_TOKEN }}

  # End-to-end smoke test of the just-deployed server, through the real public
  # path (lobby nginx -> private network -> support container). A red job here
  # turns the main build red, which emails on failure. This is an alarm, not a
  # gate: the deploy has already happened, so it signals "this deploy broke
  # prod" rather than preventing it.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    # Own group: sharing the deploy group would let a pending smoke test
    # replace, ie cancel, the next run's pending deploy.
    concurrency:
      group: ${{ github.workflow }}-smoke-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    steps:
      # Only /support is publicly proxied (/q/health is private-net only), so we
      # probe the public status page: anonymous GET returns 200 and it reads the
      # DB, so a 200 confirms the app booted and its datasource is reachable.
      # Retry with backoff to ride out container/JVM/Flyway warmup after deploy.
      - name: Smoke-test the deployed server
        run: |
          url="https://prod.triplea-game.org/support/maps/status"
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Smoke check passed: HTTP $code from $url (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code from $url; retrying in 10s"
            sleep 10
          done
          echo "Smoke check FAILED: $url never returned 200"
          exit 1
