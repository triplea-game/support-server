# Runs when main branch is updated.
# Creates docker image & publishes to docker packages
# Uses ansible to trigger a redeployment of the latest code
name: Main Branch Build and Deploy
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: extractions/setup-just@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run PR tests
        run: just check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push docker containers
        run: just docker-push

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Load SSH private key into ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Cache Ansible Galaxy collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('deploy/ansible/requirements.yml') }}
      - name: Install Ansible and dependencies
        run: |
          uv tool install --with linode_api4 --with-executables-from ansible-core,ansible-lint ansible
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Deploy
        env:
          LINODE_ACCESS_TOKEN: ${{ secrets.LINODE_READ_ONLY_TOKEN }}
        run: SSH_USER=deploy just deploy

  # End-to-end smoke test of the just-deployed server, through the real public
  # path (lobby nginx -> private network -> support container). A red job here
  # turns the main build red, which emails on failure. This is an alarm, not a
  # gate: the deploy has already happened, so it signals "this deploy broke
  # prod" rather than preventing it.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Only /support is publicly proxied (/q/health is private-net only), so we
      # probe the public status page: anonymous GET returns 200 and it reads the
      # DB, so a 200 confirms the app booted and its datasource is reachable.
      # Retry with backoff to ride out container/JVM/Flyway warmup after deploy.
      - name: Smoke-test the deployed server
        run: |
          url="https://prod.triplea-game.org/support/maps/status"
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Smoke check passed: HTTP $code from $url (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code from $url; retrying in 10s"
            sleep 10
          done
          echo "Smoke check FAILED: $url never returned 200"
          exit 1
